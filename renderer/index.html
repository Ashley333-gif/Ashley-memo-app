<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AshleyMemo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="header">
      <h1 class="title">AshleyMemo</h1>
    </header>

    <!-- 搜索栏 -->
    <div class="search-bar">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="搜索剪贴板历史..."
        autocomplete="off"
      />
    </div>

    <!-- 卡片列表区域 -->
    <main class="content" id="contentArea">
      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="6" width="32" height="36" rx="4" stroke="#DDB8C0" stroke-width="2"/>
            <line x1="14" y1="14" x2="34" y2="14" stroke="#DDB8C0" stroke-width="2" stroke-linecap="round"/>
            <line x1="14" y1="20" x2="28" y2="20" stroke="#DDB8C0" stroke-width="2" stroke-linecap="round"/>
            <line x1="14" y1="26" x2="30" y2="26" stroke="#DDB8C0" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="empty-title">暂无剪贴板历史</p>
        <p class="empty-desc">复制内容后将自动显示在这里</p>
      </div>

      <!-- 卡片列表 -->
      <div class="card-list" id="cardList"></div>
    </main>

    <!-- 底部设置栏 -->
    <footer class="settings-bar">
      <span class="settings-label">保留时长</span>
      <div class="retention-buttons" id="retentionButtons">
        <button class="retention-btn" data-days="1">1 天</button>
        <button class="retention-btn" data-days="3">3 天</button>
        <button class="retention-btn" data-days="5">5 天</button>
      </div>
    </footer>
  </div>

  <!-- 图片预览模态框 -->
  <div class="image-preview-overlay" id="imagePreview">
    <img id="imagePreviewImg" src="" alt="预览" />
  </div>

  <script src="app.js"></script>
</body>
</html>
